[package]
name = "meshbrep"
version = "0.4.0"
description = "Rebuild an exact B-rep (planes, cylinders, cones, spheres, tori, B-spline surfaces) from a triangle mesh tagged with the surface each triangle came from, write it as STEP AP214, and make fillet and chamfer tools"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The NeoSCAD contributors"]
repository = "https://github.com/neoscad/meshbrep"
homepage = "https://github.com/neoscad/meshbrep"
documentation = "https://docs.rs/meshbrep"
readme = "README.md"
keywords = ["brep", "step", "cad", "mesh", "geometry"]
categories = ["graphics", "mathematics", "encoding"]
# An allow-list, so that nothing new in the repository ships by accident;
# `cargo package --list` shows what does. `oracle/` (the OCCT read-back
# checker, C++ built against a downloaded OCCT) stays in the repository
# only: users of the library never need it, and the test that drives it
# skips itself unless MESHBREP_OCCT_CHECK names a built checker.
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]

[dependencies]
# Transcendental functions in pure Rust, so that the output (STEP text
# included) is the same bit for bit on every target: the platform libm of
# macOS, glibc and wasm32 differ in the last place.
libm = "0.2.16"

[dev-dependencies]
# The tests build their meshes with Manifold's booleans, as a caller would.
manifold-rust = { version = "0.16.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Matrix and knot-vector code indexes several arrays with one subscript;
# iterator chains there are harder to check against the textbook algorithms.
needless_range_loop = "allow"
dbg_macro = "warn"
todo = "warn"
